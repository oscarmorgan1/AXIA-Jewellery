<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/assets/img/axia-logo.png" />

    <meta name="theme-color" content="#F4F1EA" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>try{var t=localStorage.getItem("axia_admin_theme");t=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#0E0F11":"#F4F1EA"}catch(e){}</script>

  </head>
