# Firebase App Hosting settings for the AXIA site (backend connected to GitHub,
# so every merge to main builds with `npm run build` and runs `npm start`).
#
# Secrets live in Cloud Secret Manager, never in this repo. Create each one
# BEFORE merging a change that references it, or the rollout fails:
#   npx firebase apphosting:secrets:set <name> --project axia-jewellery
# (say yes when it offers to grant your backend access). See README "Payments and email".

runConfig:
  minInstances: 0
  maxInstances: 4
  # Two CPUs and 2 GiB so videos uploaded in the portal convert quickly
  # (a 4K phone video needs about 500 MB while converting; 1 GiB ran out).
  cpu: 2
  memoryMiB: 2048

env:
  # Stripe secret key: sk_test_... until cutover, then sk_live_...
  - variable: STRIPE_SECRET_KEY
    secret: stripe-secret-key
    availability: [RUNTIME]

  # Signing secret of the webhook endpoint registered in Stripe (whsec_...)
  - variable: STRIPE_WEBHOOK_SECRET
    secret: stripe-webhook-secret
    availability: [RUNTIME]

  # Resend API key (re_...)
  - variable: RESEND_API_KEY
    secret: resend-api-key
    availability: [RUNTIME]

  # Signing secret of the Resend webhook (whsec_...) that reports deliveries,
  # opens and clicks for Admin > Marketing. Endpoint: /api/resend/webhook
  - variable: RESEND_WEBHOOK_SECRET
    secret: resend-webhook-secret
    availability: [RUNTIME]

  # Sender for order confirmations. The domain must be verified in Resend.
  - variable: ORDER_EMAIL_FROM
    value: "AXIA <orders@axiajewellery.com>"
    availability: [RUNTIME]

  # Where customer replies to the confirmation email go.
  - variable: ORDER_EMAIL_REPLY_TO
    value: "support@axiajewellery.com"
    availability: [RUNTIME]

  # Who gets an email for each new support-page inquiry (comma-separate for
  # more than one). Server-side only: never sent to the browser.
  - variable: INQUIRY_ALERT_TO
    value: "dear.konrad@gmail.com"
    availability: [RUNTIME]

  # Public address used in Stripe return links and email images. Pinned so a
  # forged Host header can't point them at another site.
  - variable: PUBLIC_SITE_URL
    value: "https://axiajewellery.com"
    availability: [RUNTIME]

  # Firebase App Check reCAPTCHA site key (see admin-portal/src/appCheck.ts).
  # Read by `npm run build`, so BUILD availability. It ends up in the public
  # JavaScript like any site key; it's a secret only so it can be rotated with
  # one command and a new rollout, without a code change:
  #   npx firebase apphosting:secrets:set appcheck-site-key --project axia-jewellery
  - variable: VITE_APPCHECK_SITE_KEY
    secret: appcheck-site-key
    availability: [BUILD]

  # Uncomment if the key above is a reCAPTCHA Enterprise key (default: v3).
  # - variable: VITE_APPCHECK_PROVIDER
  #   value: "enterprise"
  #   availability: [BUILD]
