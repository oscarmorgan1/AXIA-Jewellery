<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<base href="/">
<title>AXIA is unavailable</title>
<meta name="description" content="AXIA is down for maintenance. We'll be back shortly.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111315">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/tokens.css?v=20260930a">
<link rel="stylesheet" href="assets/css/axia.css?v=20260930a">

<style>
  html,body{height:100%}
  body{background:var(--obsidian);color:var(--bone);margin:0}
  .mt{position:relative;overflow:hidden;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:clamp(var(--s-7),8vw,var(--s-9)) var(--gutter)}
  .mt::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 45%,rgba(174,180,188,.10),transparent 70%);pointer-events:none}
  .mt__in{position:relative;max-width:40rem;margin-inline:auto;text-align:center}
  .mt .nav__brand{display:inline-block;font-size:clamp(1.6rem,4vw,2.2rem);color:var(--bone);margin-bottom:var(--s-8)}
  .mt .eyebrow{display:block;margin-bottom:var(--s-4)}
  .mt h1{font-family:var(--font-display);font-weight:700;font-size:var(--t-64);text-transform:uppercase;line-height:.95;margin:0 0 var(--s-5);text-wrap:balance}
  .mt p{color:var(--on-dark-2);font-size:var(--t-body-l);max-width:40ch;margin:0 auto var(--s-6);text-wrap:pretty}
  .mt a.link-u{color:var(--on-dark)}
</style>
</head>
<body class="chrome-dark">
<main class="mt on-obsidian">
  <div class="mt__in">
    <span class="nav__brand" aria-label="AXIA"><span class="wm-img" aria-hidden="true"></span></span>
    <span class="eyebrow eyebrow--ice">Down for maintenance</span>
    <h1>AXIA is unavailable</h1>
    <p>We're making a few changes behind the scenes. The site will be back shortly, and your bag is saved for when it is.</p>
    <a class="link-u" href="mailto:support@axiajewellery.com">support@axiajewellery.com</a>
  </div>
</main>
</body>
</html>
